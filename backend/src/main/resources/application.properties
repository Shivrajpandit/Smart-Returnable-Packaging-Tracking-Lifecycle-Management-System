# =============================================================================
# SMART RETURNABLE PACKAGING TRACKING AND LIFECYCLE MANAGEMENT SYSTEM (SRPT-LMS)
# Application Properties Configuration
# =============================================================================

# 1. Server Configuration
server.port=8080
server.servlet.context-path=/

# 2. MySQL Database Connection Configuration
# NOTE FOR STUDENTS: 
# Replace 'root' and 'root' with your local MySQL username and password.
# You can also pass them via environment variables: DB_USERNAME and DB_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/packaging_tracking?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Spring Data JPA & Hibernate Configuration
# 'validate' verifies that existing database tables match JPA Entities without altering data
# Change to 'update' if you want Hibernate to auto-add missing columns
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 4. JSON Serialization & Date/Time Settings
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false

# 5. Application Logging Levels
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.packaging=DEBUG
