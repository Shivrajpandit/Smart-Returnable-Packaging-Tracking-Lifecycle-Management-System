<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Administration - SRPT-LMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="app-wrapper">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div class="topbar">
        <h1 class="page-title">User Accounts & Role Permissions</h1>
        <div id="user-profile-badge"></div>
      </div>

      <div class="p-4">
        
        <!-- Actions -->
        <div class="content-card mb-4 d-flex justify-content-between align-items-center">
          <div>
            <h5 class="fw-bold mb-0">System User Directory</h5>
            <small class="text-muted">Manage system administrators, warehouse personnel, and executive managers</small>
          </div>
          <button class="btn btn-primary" onclick="openUserModal()">
            <i class="bi bi-person-plus-fill me-1"></i> Add System User
          </button>
        </div>

        <!-- Users Table -->
        <div class="content-card">
          <div class="table-responsive">
            <table class="table table-custom align-middle">
              <thead>
                <tr>
                  <th>User ID</th>
                  <th>Full Name</th>
                  <th>Email (Login Identifier)</th>
                  <th>Role Privilege</th>
                  <th>Created At</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="users-table-body">
                <tr><td colspan="6" class="text-center py-4 text-muted">Loading user directory...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Add/Edit User Modal -->
  <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="user-form">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="userModalTitle">Add System User</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="userId">

            <div class="mb-3">
              <label class="form-label fw-semibold">Full Name</label>
              <input type="text" class="form-control" id="name" placeholder="e.g. Ramesh Kulkarni" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Email Address</label>
              <input type="email" class="form-control" id="email" placeholder="e.g. ramesh.k@packaging.com" required>
            </div>

            <div class="mb-3" id="password-group">
              <label class="form-label fw-semibold">Password</label>
              <input type="password" class="form-control" id="password" placeholder="Enter secure password">
              <small class="text-muted" id="password-help">Will be securely encrypted using BCrypt</small>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">System Role Assignment</label>
              <select class="form-select" id="role" required>
                <option value="ADMIN">ADMIN (Full system access & user management)</option>
                <option value="WAREHOUSE_STAFF" selected>WAREHOUSE_STAFF (Issue, return, damage & repair)</option>
                <option value="MANAGER">MANAGER (Read-only analytics & reporting dashboards)</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save User Account</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let usersList = [];

    async function loadUsers() {
      usersList = await API.users.getAll();
      const tbody = document.getElementById('users-table-body');

      if (usersList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">No users found.</td></tr>`;
        return;
      }

      tbody.innerHTML = usersList.map(u => `
        <tr>
          <td><span class="text-muted">#${u.userId}</span></td>
          <td><strong>${u.name}</strong></td>
          <td><a href="mailto:${u.email}">${u.email}</a></td>
          <td><span class="role-pill role-${u.role}">${u.role.replace('_', ' ')}</span></td>
          <td><small class="text-muted">${u.createdAt ? new Date(u.createdAt).toLocaleDateString() : 'Active'}</small></td>
          <td>
            <div class="btn-group btn-group-sm">
              <button class="btn btn-outline-primary" onclick="editUser(${u.userId})"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-outline-danger" onclick="deleteUser(${u.userId})"><i class="bi bi-trash"></i></button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    window.openUserModal = function() {
      document.getElementById('user-form').reset();
      document.getElementById('userId').value = '';
      document.getElementById('email').disabled = false;
      document.getElementById('password').required = true;
      document.getElementById('password-help').textContent = 'Will be securely encrypted using BCrypt';
      document.getElementById('userModalTitle').textContent = 'Add System User';
      new bootstrap.Modal(document.getElementById('userModal')).show();
    };

    window.editUser = function(id) {
      const u = usersList.find(item => item.userId === id);
      if (!u) return;
      document.getElementById('userId').value = u.userId;
      document.getElementById('name').value = u.name;
      document.getElementById('email').value = u.email;
      document.getElementById('email').disabled = true;
      document.getElementById('password').value = '';
      document.getElementById('password').required = false;
      document.getElementById('password-help').textContent = 'Leave blank to keep existing password';
      document.getElementById('role').value = u.role;
      document.getElementById('userModalTitle').textContent = 'Edit System User';
      new bootstrap.Modal(document.getElementById('userModal')).show();
    };

    window.deleteUser = async function(id) {
      if (confirm('Are you sure you want to delete this user account?')) {
        try {
          await API.users.delete(id);
          showNotification('User deleted successfully!', 'success');
          await loadUsers();
        } catch (err) {
          // Handled
        }
      }
    };

    document.addEventListener('DOMContentLoaded', async () => {
      const user = Auth.requireAuth(['ADMIN']);
      if (!user) return;
      Auth.initNavigation('users');

      await loadUsers();

      document.getElementById('user-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('userId').value;
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const role = document.getElementById('role').value;

        try {
          if (id) {
            await API.users.update(id, { name, role, password });
            showNotification('User updated successfully!', 'success');
          } else {
            await API.users.create({ name, email, password, role });
            showNotification('User created successfully!', 'success');
          }
          bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
          await loadUsers();
        } catch (err) {
          // Handled
        }
      });
    });
  </script>
</body>
</html>
