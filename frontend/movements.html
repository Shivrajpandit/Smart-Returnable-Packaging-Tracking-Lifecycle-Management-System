<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Movements - SRPT-LMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="app-wrapper">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div class="topbar">
        <h1 class="page-title">Facility & Transit Movements</h1>
        <div id="user-profile-badge"></div>
      </div>

      <div class="p-4">
        
        <div class="row g-4 mb-4">
          <!-- Log Movement Form -->
          <div class="col-lg-4">
            <div class="content-card">
              <h5 class="fw-bold mb-3 d-flex align-items-center gap-2">
                <i class="bi bi-truck text-primary"></i> Log Asset Movement
              </h5>
              
              <form id="movement-form">
                <div class="mb-3">
                  <label class="form-label fw-semibold">Asset</label>
                  <select id="assetId" class="form-select" required>
                    <option value="">Select asset to move...</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold">Origin / From Location</label>
                  <input type="text" id="fromLocation" class="form-control" placeholder="e.g. Pune Central Hub Bay 2" required>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold">Destination / To Location</label>
                  <input type="text" id="toLocation" class="form-control" placeholder="e.g. Chennai Automotive DC" required>
                </div>

                <div class="mb-4">
                  <label class="form-label fw-semibold">Transit Remarks</label>
                  <textarea id="remarks" class="form-control" rows="2" placeholder="e.g. Inter-warehouse inventory rebalancing"></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                  <i class="bi bi-send-check me-1"></i> Record Movement Event
                </button>
              </form>
            </div>
          </div>

          <!-- Movement History Table -->
          <div class="col-lg-8">
            <div class="content-card">
              <h5 class="fw-bold mb-3">Facility Logistics Movement Log</h5>
              <div class="table-responsive">
                <table class="table table-custom align-middle">
                  <thead>
                    <tr>
                      <th>Event #</th>
                      <th>Asset Code</th>
                      <th>Origin</th>
                      <th>Destination</th>
                      <th>Date / Time</th>
                      <th>Operator</th>
                    </tr>
                  </thead>
                  <tbody id="movements-table-body">
                    <tr><td colspan="6" class="text-center py-4 text-muted">Loading movement logs...</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let currentUser = null;

    async function loadAssets() {
      const assets = await API.assets.getAll();
      const assetSelect = document.getElementById('assetId');
      assetSelect.innerHTML = `<option value="">Select asset to move...</option>` +
        assets.map(a => `<option value="${a.assetId}">[${a.assetCode}] ${a.packagingType?.typeName || ''} (${a.warehouse?.warehouseName || ''})</option>`).join('');
    }

    async function loadMovements() {
      const movements = await API.movements.getAll();
      const tbody = document.getElementById('movements-table-body');

      if (movements.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">No movement events logged yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = movements.map(m => `
        <tr>
          <td><span class="text-muted">#${m.movementId}</span></td>
          <td><strong class="text-primary">${m.asset?.assetCode || 'N/A'}</strong></td>
          <td>${m.fromLocation}</td>
          <td><span class="text-dark fw-semibold">${m.toLocation}</span></td>
          <td><small>${new Date(m.movementDate).toLocaleString()}</small></td>
          <td><small class="text-muted">${m.movedBy?.name || 'Staff'}</small></td>
        </tr>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', async () => {
      currentUser = Auth.requireAuth(['ADMIN', 'WAREHOUSE_STAFF']);
      if (!currentUser) return;
      Auth.initNavigation('movements');

      await loadAssets();
      await loadMovements();

      document.getElementById('movement-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const assetId = parseInt(document.getElementById('assetId').value);
        const fromLocation = document.getElementById('fromLocation').value;
        const toLocation = document.getElementById('toLocation').value;
        const remarks = document.getElementById('remarks').value;

        try {
          await API.movements.create({
            assetId,
            fromLocation,
            toLocation,
            movedBy: currentUser.userId,
            remarks
          });

          showNotification('Movement record saved!', 'success');
          document.getElementById('movement-form').reset();
          await loadMovements();
        } catch (err) {
          // Handled
        }
      });
    });
  </script>
</body>
</html>
