<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - SRPT-LMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }
  </style>
</head>
<body>

  <div class="login-container p-3">
    <div class="card border-0 shadow-lg rounded-4 overflow-hidden" style="max-width: 460px; width: 100%;">
      <div class="card-header bg-dark text-white text-center py-4 border-bottom border-secondary">
        <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-25 text-primary mb-2">
          <i class="bi bi-boxes fs-2"></i>
        </div>
        <h4 class="fw-bold mb-0">SRPT-LMS Portal</h4>
        <small class="text-secondary">Smart Returnable Packaging Tracking System</small>
      </div>

      <div class="card-body p-4 p-md-5">
        
        <!-- Quick Fill for College Demo -->
        <div class="mb-4">
          <label class="form-label text-muted small fw-bold text-uppercase">Demo Quick-Login</label>
          <div class="btn-group w-100" role="group">
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setCredentials('admin@packaging.com', 'admin123')">
              <i class="bi bi-shield-lock"></i> Admin
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setCredentials('staff@packaging.com', 'staff123')">
              <i class="bi bi-person-badge"></i> Staff
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setCredentials('manager@packaging.com', 'manager123')">
              <i class="bi bi-bar-chart"></i> Manager
            </button>
          </div>
        </div>

        <form id="login-form">
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="email" value="admin@packaging.com" required>
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
              <input type="password" class="form-control" id="password" value="admin123" required>
            </div>
          </div>

          <button type="submit" id="btn-login" class="btn btn-primary w-100 py-2 fw-semibold">
            <span id="btn-text">Sign In to Dashboard</span>
            <span id="btn-spinner" class="spinner-border spinner-border-sm d-none"></span>
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <a href="index.html" class="text-decoration-none text-muted small">
            <i class="bi bi-arrow-left"></i> Back to Homepage
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function setCredentials(email, pass) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pass;
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');

      try {
        btnText.textContent = 'Authenticating...';
        btnSpinner.classList.remove('d-none');

        const response = await API.auth.login({ email, password });
        Auth.setUser(response);
        showNotification('Login successful! Redirecting...', 'success');
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 600);
      } catch (err) {
        btnText.textContent = 'Sign In to Dashboard';
        btnSpinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
