<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Packaging Types - SRPT-LMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="app-wrapper">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div class="topbar">
        <h1 class="page-title">Packaging Categories & Types</h1>
        <div id="user-profile-badge"></div>
      </div>

      <div class="p-4">
        
        <!-- Actions -->
        <div class="content-card mb-4 d-flex justify-content-between align-items-center">
          <div>
            <h5 class="fw-bold mb-0">Packaging Asset Specifications</h5>
            <small class="text-muted">Master specifications for crates, metal containers, pallets, and drums</small>
          </div>
          <button class="btn btn-primary" onclick="openTypeModal()">
            <i class="bi bi-plus-lg me-1"></i> Add Packaging Type
          </button>
        </div>

        <!-- Types List -->
        <div class="content-card">
          <div class="table-responsive">
            <table class="table table-custom align-middle">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Packaging Category Name</th>
                  <th>Description / Material</th>
                  <th>Capacity (KG)</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="types-table-body">
                <tr><td colspan="5" class="text-center py-4 text-muted">Loading packaging categories...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Add/Edit Packaging Type Modal -->
  <div class="modal fade" id="typeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="type-form">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="typeModalTitle">Add Packaging Type</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="typeId">

            <div class="mb-3">
              <label class="form-label fw-semibold">Type / Category Name</label>
              <input type="text" class="form-control" id="typeName" placeholder="e.g. Heavy-Duty Steel Mesh Bin" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Weight Capacity (KG)</label>
              <input type="number" step="0.01" class="form-control" id="capacityKg" placeholder="e.g. 1000.00" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Technical Description</label>
              <textarea class="form-control" id="description" rows="2" placeholder="Dimensions, material grade, handling specs"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Category</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let typesList = [];

    async function loadTypes() {
      typesList = await API.packagingTypes.getAll();
      const tbody = document.getElementById('types-table-body');

      if (typesList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">No packaging types defined yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = typesList.map(t => `
        <tr>
          <td><span class="text-muted">#${t.typeId}</span></td>
          <td><strong class="text-primary">${t.typeName}</strong></td>
          <td>${t.description || '--'}</td>
          <td><span class="badge bg-light text-dark border fs-6">${t.capacityKg} KG</span></td>
          <td>
            <div class="btn-group btn-group-sm">
              <button class="btn btn-outline-primary" onclick="editType(${t.typeId})"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-outline-danger" onclick="deleteType(${t.typeId})"><i class="bi bi-trash"></i></button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    window.openTypeModal = function() {
      document.getElementById('type-form').reset();
      document.getElementById('typeId').value = '';
      document.getElementById('typeModalTitle').textContent = 'Add Packaging Category';
      new bootstrap.Modal(document.getElementById('typeModal')).show();
    };

    window.editType = function(id) {
      const t = typesList.find(item => item.typeId === id);
      if (!t) return;
      document.getElementById('typeId').value = t.typeId;
      document.getElementById('typeName').value = t.typeName;
      document.getElementById('capacityKg').value = t.capacityKg;
      document.getElementById('description').value = t.description || '';
      document.getElementById('typeModalTitle').textContent = 'Edit Packaging Category';
      new bootstrap.Modal(document.getElementById('typeModal')).show();
    };

    window.deleteType = async function(id) {
      if (confirm('Are you sure you want to delete this packaging category?')) {
        try {
          await API.packagingTypes.delete(id);
          showNotification('Packaging type deleted successfully!', 'success');
          await loadTypes();
        } catch (err) {
          // Handled
        }
      }
    };

    document.addEventListener('DOMContentLoaded', async () => {
      const user = Auth.requireAuth(['ADMIN']);
      if (!user) return;
      Auth.initNavigation('packaging-types');

      await loadTypes();

      document.getElementById('type-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('typeId').value;
        const data = {
          typeName: document.getElementById('typeName').value,
          capacityKg: parseFloat(document.getElementById('capacityKg').value),
          description: document.getElementById('description').value
        };

        try {
          if (id) {
            await API.packagingTypes.update(id, data);
            showNotification('Packaging type updated successfully!', 'success');
          } else {
            await API.packagingTypes.create(data);
            showNotification('Packaging type created successfully!', 'success');
          }
          bootstrap.Modal.getInstance(document.getElementById('typeModal')).hide();
          await loadTypes();
        } catch (err) {
          // Handled
        }
      });
    });
  </script>
</body>
</html>
