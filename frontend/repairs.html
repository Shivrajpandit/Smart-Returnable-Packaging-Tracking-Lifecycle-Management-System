<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repair Management - SRPT-LMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="app-wrapper">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div class="topbar">
        <h1 class="page-title">Maintenance & Workshop Repairs</h1>
        <div id="user-profile-badge"></div>
      </div>

      <div class="p-4">
        
        <div class="row g-4 mb-4">
          <!-- Create Repair Ticket Card -->
          <div class="col-lg-4">
            <div class="content-card">
              <h5 class="fw-bold mb-3 d-flex align-items-center gap-2">
                <i class="bi bi-tools text-secondary"></i> Create Repair Ticket
              </h5>
              
              <form id="repair-form">
                <div class="mb-3">
                  <label class="form-label fw-semibold">Asset to Repair</label>
                  <select id="assetId" class="form-select" required>
                    <option value="">Select asset...</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold">Link Damage Incident (Optional)</label>
                  <select id="damageId" class="form-select">
                    <option value="">No linked incident / Routine maintenance</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold">Repair Status</label>
                  <select id="repairStatus" class="form-select" required>
                    <option value="IN_PROGRESS" selected>IN_PROGRESS (Under active maintenance)</option>
                    <option value="PENDING">PENDING (Queued in workshop)</option>
                    <option value="COMPLETED">COMPLETED (Fixed & ready for reuse)</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold">Initial Repair Cost (₹)</label>
                  <input type="number" step="0.01" id="repairCost" class="form-control" value="0.00" required>
                </div>

                <div class="mb-4">
                  <label class="form-label fw-semibold">Maintenance Remarks</label>
                  <textarea id="remarks" class="form-control" rows="2" placeholder="e.g. Straighten deformed frame, replacement bolts"></textarea>
                </div>

                <button type="submit" class="btn btn-secondary w-100 py-2 fw-semibold text-white">
                  <i class="bi bi-wrench me-1"></i> Open Repair Ticket
                </button>
              </form>
            </div>
          </div>

          <!-- Repair Tickets Table -->
          <div class="col-lg-8">
            <div class="content-card">
              <h5 class="fw-bold mb-3">All Workshop Repair Tickets</h5>
              <div class="table-responsive">
                <table class="table table-custom align-middle">
                  <thead>
                    <tr>
                      <th>Ticket #</th>
                      <th>Asset</th>
                      <th>Linked Damage</th>
                      <th>Cost (₹)</th>
                      <th>Status</th>
                      <th>Repaired By</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody id="repairs-table-body">
                    <tr><td colspan="7" class="text-center py-4 text-muted">Loading repair tickets...</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Update Repair Modal -->
  <div class="modal fade" id="updateRepairModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="update-repair-form">
          <div class="modal-header">
            <h5 class="modal-title fw-bold">Update Repair Ticket</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="modalRepairId">
            <input type="hidden" id="modalAssetId">

            <div class="mb-3">
              <label class="form-label fw-semibold">Repair Status</label>
              <select class="form-select" id="modalRepairStatus" required>
                <option value="PENDING">PENDING</option>
                <option value="IN_PROGRESS">IN_PROGRESS</option>
                <option value="COMPLETED">COMPLETED (Sets Asset to AVAILABLE)</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Final Repair Cost (₹)</label>
              <input type="number" step="0.01" class="form-control" id="modalRepairCost" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Completion / Work Date</label>
              <input type="date" class="form-control" id="modalRepairDate" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Remarks & Findings</label>
              <textarea class="form-control" id="modalRemarks" rows="2"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Ticket Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let currentUser = null;
    let allRepairs = [];

    async function loadFormOptions() {
      const assets = await API.assets.getAll();
      const damages = await API.damages.getAll();

      const assetSelect = document.getElementById('assetId');
      assetSelect.innerHTML = `<option value="">Select asset...</option>` +
        assets.map(a => `<option value="${a.assetId}">[${a.assetCode}] ${a.packagingType?.typeName || ''} (${a.status})</option>`).join('');

      const damageSelect = document.getElementById('damageId');
      damageSelect.innerHTML = `<option value="">No linked incident / Routine maintenance</option>` +
        damages.map(d => `<option value="${d.damageId}">#${d.damageId} - [${d.asset?.assetCode}] ${d.damageType} (Est: ₹${d.estimatedCost})</option>`).join('');

      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('assetId')) assetSelect.value = urlParams.get('assetId');
      if (urlParams.get('damageId')) damageSelect.value = urlParams.get('damageId');
    }

    async function loadRepairs() {
      allRepairs = await API.repairs.getAll();
      const tbody = document.getElementById('repairs-table-body');

      if (allRepairs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">No repair records found.</td></tr>`;
        return;
      }

      tbody.innerHTML = allRepairs.slice().reverse().map(r => {
        const badgeClass = r.repairStatus === 'COMPLETED' ? 'bg-success' : (r.repairStatus === 'IN_PROGRESS' ? 'bg-primary' : 'bg-warning text-dark');
        return `
          <tr>
            <td><span class="text-muted">#${r.repairId}</span></td>
            <td><strong class="text-primary">${r.asset?.assetCode || 'N/A'}</strong></td>
            <td>${r.damageRecord ? `#${r.damageRecord.damageId} (${r.damageRecord.damageType})` : '<span class="text-muted">Direct Ticket</span>'}</td>
            <td><strong>₹ ${Number(r.repairCost || 0).toFixed(2)}</strong></td>
            <td><span class="badge ${badgeClass} rounded-pill">${r.repairStatus}</span></td>
            <td><small class="text-muted">${r.repairedBy?.name || 'Staff'}</small></td>
            <td>
              <button class="btn btn-sm btn-outline-primary" onclick="openUpdateModal(${r.repairId})">
                <i class="bi bi-pencil-square"></i> Update
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    window.openUpdateModal = function(repairId) {
      const repair = allRepairs.find(r => r.repairId === repairId);
      if (!repair) return;

      document.getElementById('modalRepairId').value = repair.repairId;
      document.getElementById('modalAssetId').value = repair.asset?.assetId;
      document.getElementById('modalRepairStatus').value = repair.repairStatus;
      document.getElementById('modalRepairCost').value = repair.repairCost || 0;
      document.getElementById('modalRepairDate').value = repair.repairDate || new Date().toISOString().split('T')[0];
      document.getElementById('modalRemarks').value = repair.remarks || '';

      new bootstrap.Modal(document.getElementById('updateRepairModal')).show();
    };

    document.addEventListener('DOMContentLoaded', async () => {
      currentUser = Auth.requireAuth(['ADMIN', 'WAREHOUSE_STAFF']);
      if (!currentUser) return;
      Auth.initNavigation('repairs');

      await loadFormOptions();
      await loadRepairs();

      document.getElementById('repair-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const assetId = parseInt(document.getElementById('assetId').value);
        const damageIdVal = document.getElementById('damageId').value;
        const damageId = damageIdVal ? parseInt(damageIdVal) : null;
        const repairStatus = document.getElementById('repairStatus').value;
        const repairCost = parseFloat(document.getElementById('repairCost').value);
        const remarks = document.getElementById('remarks').value;

        try {
          await API.repairs.create({
            assetId,
            damageId,
            repairedBy: currentUser.userId,
            repairCost,
            repairStatus,
            remarks
          });

          showNotification('Repair ticket created successfully!', 'success');
          document.getElementById('repair-form').reset();
          await loadFormOptions();
          await loadRepairs();
        } catch (err) {
          // Handled
        }
      });

      document.getElementById('update-repair-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const repairId = parseInt(document.getElementById('modalRepairId').value);
        const assetId = parseInt(document.getElementById('modalAssetId').value);
        const repairStatus = document.getElementById('modalRepairStatus').value;
        const repairCost = parseFloat(document.getElementById('modalRepairCost').value);
        const repairDate = document.getElementById('modalRepairDate').value;
        const remarks = document.getElementById('modalRemarks').value;

        try {
          await API.repairs.update(repairId, {
            assetId,
            repairedBy: currentUser.userId,
            repairDate,
            repairCost,
            repairStatus,
            remarks
          });

          showNotification(`Repair #${repairId} updated successfully!`, 'success');
          bootstrap.Modal.getInstance(document.getElementById('updateRepairModal')).hide();
          await loadFormOptions();
          await loadRepairs();
        } catch (err) {
          // Handled
        }
      });
    });
  </script>
</body>
</html>
