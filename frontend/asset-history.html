<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>360° Asset Lifecycle History - SRPT-LMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="app-wrapper">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div class="topbar">
        <h1 class="page-title">360° Asset Lifecycle Audit History</h1>
        <div id="user-profile-badge"></div>
      </div>

      <div class="p-4">
        
        <!-- Search / Select Asset Bar -->
        <div class="content-card mb-4">
          <div class="row align-items-center g-3">
            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted">Select Packaging Asset to Inspect</label>
              <select id="select-asset" class="form-select">
                <option value="">Choose asset...</option>
              </select>
            </div>
            <div class="col-md-6 text-md-end mt-4">
              <a href="assets.html" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Back to Asset Registry
              </a>
            </div>
          </div>
        </div>

        <!-- Asset Overview Header Card -->
        <div id="asset-overview-container"></div>

        <!-- 360 Timeline Stream -->
        <div class="content-card">
          <h5 class="fw-bold mb-4 d-flex align-items-center gap-2">
            <i class="bi bi-clock-history text-primary"></i> Complete Chronological Lifecycle Stream
          </h5>
          <div id="timeline-container">
            <div class="text-center py-4 text-muted">Select an asset above to view its full lifecycle stream.</div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function loadAssetSelector() {
      const assets = await API.assets.getAll();
      const select = document.getElementById('select-asset');
      select.innerHTML = `<option value="">Choose asset...</option>` +
        assets.map(a => `<option value="${a.assetId}">[${a.assetCode}] ${a.packagingType?.typeName || ''} - Status: ${a.status}</option>`).join('');

      const urlParams = new URLSearchParams(window.location.search);
      const preAssetId = urlParams.get('assetId') || (assets.length > 0 ? assets[0].assetId : null);

      if (preAssetId) {
        select.value = preAssetId;
        await renderAssetHistory(preAssetId);
      }

      select.addEventListener('change', async (e) => {
        if (e.target.value) {
          await renderAssetHistory(e.target.value);
        }
      });
    }

    async function renderAssetHistory(assetId) {
      const history = await API.assets.getHistory(assetId);
      const asset = history.asset;

      // 1. Render Overview Card
      document.getElementById('asset-overview-container').innerHTML = `
        <div class="content-card mb-4 bg-light border">
          <div class="row g-3 align-items-center">
            <div class="col-md-3">
              <div class="text-muted small text-uppercase fw-bold">Asset Identifier</div>
              <h3 class="fw-bold text-primary mb-0">${asset.assetCode}</h3>
              <span class="badge-status badge-${asset.status} mt-1">${asset.status}</span>
            </div>
            <div class="col-md-3">
              <div class="text-muted small text-uppercase fw-bold">Packaging Category</div>
              <div class="fw-bold">${asset.packagingType?.typeName || 'N/A'}</div>
              <small class="text-muted">Capacity: ${asset.packagingType?.capacityKg || 0} KG</small>
            </div>
            <div class="col-md-3">
              <div class="text-muted small text-uppercase fw-bold">Home Warehouse Hub</div>
              <div class="fw-bold">${asset.warehouse?.warehouseName || 'N/A'}</div>
              <small class="text-muted">${asset.warehouse?.location || ''}</small>
            </div>
            <div class="col-md-3">
              <div class="text-muted small text-uppercase fw-bold">Commissioning Date</div>
              <div class="fw-bold">${asset.purchaseDate}</div>
              <small class="text-muted">Registered in DB</small>
            </div>
          </div>
        </div>
      `;

      // 2. Build chronological events array
      const events = [];

      // Registration
      events.push({
        stage: 'REGISTRATION',
        title: 'Asset Commissioned & Registered',
        timestamp: asset.purchaseDate + ' 09:00:00',
        dateOnly: asset.purchaseDate,
        icon: 'bi-box-seam',
        color: 'text-primary',
        details: `Initial entry into inventory at <strong>${asset.warehouse?.warehouseName || 'Central Hub'}</strong>.`
      });

      // Issues
      history.issueHistory.forEach(it => {
        events.push({
          stage: 'ISSUED',
          title: `Dispatched to ${it.customer?.companyName || 'Customer'}`,
          timestamp: it.issueDate + ' 10:00:00',
          dateOnly: it.issueDate,
          icon: 'bi-box-arrow-up-right',
          color: 'text-info',
          details: `Purpose: ${it.purpose || 'Standard transit'} | Expected Return: <strong>${it.expectedReturnDate}</strong> | Issued By: ${it.issuedBy?.name || 'Staff'}`
        });
      });

      // Returns
      history.returnHistory.forEach(rt => {
        events.push({
          stage: 'RETURNED',
          title: `Returned by ${rt.customer?.companyName || 'Customer'}`,
          timestamp: rt.returnDate + ' 15:00:00',
          dateOnly: rt.returnDate,
          icon: 'bi-box-arrow-in-down-left',
          color: 'text-success',
          details: `Inspection Condition: <span class="badge-status badge-${rt.conditionStatus}">${rt.conditionStatus}</span> | Remarks: ${rt.remarks || 'No notes'}`
        });
      });

      // Damages
      history.damageHistory.forEach(d => {
        events.push({
          stage: 'DAMAGED',
          title: `Damage Incident Logged: ${d.damageType}`,
          timestamp: d.damageDate + ' 11:30:00',
          dateOnly: d.damageDate,
          icon: 'bi-exclamation-triangle-fill',
          color: 'text-warning',
          details: `Severity: <strong>${d.severity}</strong> | Estimated Repair Cost: <strong>₹ ${Number(d.estimatedCost || 0).toFixed(2)}</strong> | ${d.description || ''}`
        });
      });

      // Repairs
      history.repairHistory.forEach(r => {
        events.push({
          stage: 'REPAIR',
          title: `Workshop Repair Ticket #${r.repairId} (${r.repairStatus})`,
          timestamp: (r.repairDate || asset.purchaseDate) + ' 16:00:00',
          dateOnly: r.repairDate || 'Active',
          icon: 'bi-tools',
          color: 'text-secondary',
          details: `Status: <strong>${r.repairStatus}</strong> | Cost: <strong>₹ ${Number(r.repairCost || 0).toFixed(2)}</strong> | Remarks: ${r.remarks || 'Under repair'}`
        });
      });

      // Movements
      history.movementHistory.forEach(m => {
        events.push({
          stage: 'MOVEMENT',
          title: `Facility Movement: ${m.fromLocation} ➔ ${m.toLocation}`,
          timestamp: m.movementDate,
          dateOnly: m.movementDate.split('T')[0],
          icon: 'bi-truck',
          color: 'text-dark',
          details: `Handled by ${m.movedBy?.name || 'Logistics'} | Remarks: ${m.remarks || 'Routine transfer'}`
        });
      });

      // Sort chronological
      events.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

      // 3. Render Timeline HTML
      const timelineContainer = document.getElementById('timeline-container');
      timelineContainer.innerHTML = `
        <div class="timeline">
          ${events.map(ev => `
            <div class="timeline-item">
              <div class="timeline-icon"><i class="bi ${ev.icon} ${ev.color}" style="font-size: 10px;"></i></div>
              <div class="timeline-content">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <h6 class="fw-bold mb-0 ${ev.color}">${ev.title}</h6>
                  <span class="badge bg-light text-dark border small">${ev.dateOnly}</span>
                </div>
                <div class="text-secondary small">${ev.details}</div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const user = Auth.requireAuth();
      if (!user) return;
      Auth.initNavigation('assets');

      await loadAssetSelector();
    });
  </script>
</body>
</html>
